<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Background Circle -->
    <radialGradient id="favBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="100%" stop-color="#09090b" />
    </radialGradient>

    <!-- Compass Gold Gradient -->
    <linearGradient id="favGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Flame Gradient -->
    <linearGradient id="favFlame" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="40%" stop-color="#ea580c" />
      <stop offset="75%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>
  </defs>

  <!-- Background rounded rect -->
  <rect width="100" height="100" rx="22" fill="url(#favBg)" stroke="#f59e0b" stroke-width="2" />

  <!-- Compass Star (Points) -->
  <!-- N -->
  <polygon points="50,10 54,46 50,44 46,46" fill="url(#favGold)" />
  <!-- S -->
  <polygon points="50,90 46,54 50,56 54,54" fill="url(#favGold)" />
  <!-- E -->
  <polygon points="90,50 54,46 56,50 54,54" fill="url(#favGold)" />
  <!-- W -->
  <polygon points="10,50 46,54 44,50 46,46" fill="url(#favGold)" />

  <!-- Diagonals -->
  <polygon points="50,50 78,22 50,42" fill="#d97706" opacity="0.7" />
  <polygon points="50,50 22,22 42,50" fill="#d97706" opacity="0.7" />
  <polygon points="50,50 78,78 58,50" fill="#d97706" opacity="0.7" />
  <polygon points="50,50 22,78 50,58" fill="#d97706" opacity="0.7" />

  <!-- Compass Ring -->
  <circle cx="50" cy="50" r="30" fill="none" stroke="url(#favGold)" stroke-width="2.5" opacity="0.9" />

  <!-- Campfire Wood Logs -->
  <rect x="34" y="69" width="32" height="6" rx="3" transform="rotate(-15 50 72)" fill="#78350f" stroke="#451a03" stroke-width="1" />
  <rect x="34" y="69" width="32" height="6" rx="3" transform="rotate(15 50 72)" fill="#78350f" stroke="#451a03" stroke-width="1" />

  <!-- Campfire Flame -->
  <path d="M50,22 
           C54,34 62,42 67,52 
           C72,62 68,72 61,75 
           C56,77 50,77 50,77 
           C50,77 44,77 39,75 
           C32,72 28,62 33,52 
           C38,42 46,34 50,22 Z" 
        fill="url(#favFlame)" />

  <!-- Inner Spark -->
  <path d="M50,44 
           C52,49 56,53 58,59 
           C60,65 56,70 50,71 
           C44,70 40,65 42,59 
           C44,53 48,49 50,44 Z" 
        fill="#ffffff" 
        opacity="0.95" />
</svg>
