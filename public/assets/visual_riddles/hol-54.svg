<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" width="100%" height="100%" class="rebus-svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="900" height="550" rx="24" fill="url(#bgGrad)" stroke="#3f3f46" stroke-width="3"/>
  <rect x="15" y="15" width="870" height="520" rx="18" fill="none" stroke="#27272a" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- Content Graphics Area -->
  
    <g transform="translate(280, 260)" filter="url(#shadow)">
      
        <path d="M-60,-20 C-60,30 60,30 60,-20 M-40,-20 C-40,15 40,15 40,-20 M-20,-20 C-20,0 20,0 20,-20 M0,-35 L0,50" fill="none" stroke="url(#goldGrad)" stroke-width="6"/>
        <line x1="-30" y1="50" x2="30" y2="50" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round"/>
        <circle cx="-60" cy="-25" r="4" fill="#f59e0b"/>
        <circle cx="-40" cy="-25" r="4" fill="#f59e0b"/>
        <circle cx="-20" cy="-25" r="4" fill="#f59e0b"/>
        <circle cx="0" cy="-40" r="5" fill="#ef4444"/>
        <circle cx="20" cy="-25" r="4" fill="#f59e0b"/>
        <circle cx="40" cy="-25" r="4" fill="#f59e0b"/>
        <circle cx="60" cy="-25" r="4" fill="#f59e0b"/>
      
    </g>
<text x="450" y="275" font-family="system-ui, sans-serif" font-size="64" font-weight="900" fill="#fbbf24" text-anchor="middle">+</text>

    <g transform="translate(620, 260)" filter="url(#shadow)">
      
        <polygon points="-50,30 50,30 40,-20 -40,-20" fill="#e2e8f0" stroke="#94a3b8" stroke-width="3"/>
        <text x="0" y="15" font-family="sans-serif" font-size="16" font-weight="900" fill="#64748b" text-anchor="middle">AG 999</text>
      
    </g>
</svg>