  <!-- Background Canvas -->
  <rect width="900" height="550" rx="24" fill="url(#bgGrad)" stroke="#3f3f46" stroke-width="3"/>
  <rect x="15" y="15" width="870" height="520" rx="18" fill="none" stroke="#27272a" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- Content Graphics Area -->
  
    <g transform="translate(620, 260)" filter="url(#shadow)">
      
        <rect x="-45" y="-30" width="90" height="90" fill="#78716c" stroke="#44403c" stroke-width="3"/>
        <rect x="-50" y="-55" width="100" height="25" fill="#a8a29e" stroke="#44403c" stroke-width="3"/>
        <rect x="-40" y="-70" width="20" height="15" fill="#78716c"/>
        <rect x="-10" y="-70" width="20" height="15" fill="#78716c"/>
        <rect x="20" y="-70" width="20" height="15" fill="#78716c"/>
        <path d="M-15,60 L-15,25 C-15,10 15,10 15,25 L15,60 Z" fill="#292524"/>
      
    </g>
<text x="450" y="275" font-family="system-ui, sans-serif" font-size="64" font-weight="900" fill="#fbbf24" text-anchor="middle">+</text>

    <g transform="translate(280, 260)" filter="url(#shadow)">
      
        <path d="M-25,10 L-25,-35 L25,-20 L25,25" stroke="#f59e0b" stroke-width="6" fill="none"/>
        <circle cx="-35" cy="15" r="14" fill="#f59e0b"/>
