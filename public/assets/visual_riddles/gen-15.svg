<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" width="100%" height="100%" class="rebus-svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="900" height="550" rx="24" fill="url(#bgGrad)" stroke="#3f3f46" stroke-width="3"/>
  <rect x="15" y="15" width="870" height="520" rx="18" fill="none" stroke="#27272a" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- Content Graphics Area -->
  
  <!-- Element 1: תָּפַסְתָּ מְרֻבֶּה -->
  <g transform="translate(260, 250)" filter="url(#shadow)">
    <rect x="-55" y="-45" width="110" height="90" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
              <circle cx="-25" cy="-15" r="10" fill="#f87171"/>
              <circle cx="0" cy="-15" r="10" fill="#fbbf24"/>
              <circle cx="25" cy="-15" r="10" fill="#34d399"/>
              <circle cx="-25" cy="15" r="10" fill="#c084fc"/>
              <circle cx="0" cy="15" r="10" fill="#38bdf8"/>
              <circle cx="25" cy="15" r="10" fill="#fb923c"/>
    <text x="0" y="130" font-family="system-ui, sans-serif" font-size="25" font-weight="900" fill="#38bdf8" text-anchor="middle">תָּפַסְתָּ מְרֻבֶּה</text>
  </g>
  <text x="450" y="270" font-family="system-ui, sans-serif" font-size="52" font-weight="900" fill="#fbbf24" text-anchor="middle">+</text>
  <!-- Element 2: לֹא תָּפַסְתָּ (0) -->
  <g transform="translate(640, 250)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="60" fill="#450a0a" stroke="#ef4444" stroke-width="4"/>
              <text x="0" y="28" font-size="80" font-weight="900" fill="#ef4444" text-anchor="middle">0</text>
    <text x="0" y="130" font-family="system-ui, sans-serif" font-size="25" font-weight="900" fill="#ef4444" text-anchor="middle">לֹא תָּפַסְתָּ (0)</text>
  </g>
</svg>