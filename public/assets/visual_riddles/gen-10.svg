<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" width="100%" height="100%" class="rebus-svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="900" height="550" rx="24" fill="url(#bgGrad)" stroke="#3f3f46" stroke-width="3"/>
  <rect x="15" y="15" width="870" height="520" rx="18" fill="none" stroke="#27272a" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- Content Graphics Area -->
  
  <!-- Element 1: נַחְתּוֹם (אוֹפֶה) -->
  <g transform="translate(190, 250)" filter="url(#shadow)">
    <circle cx="0" cy="-10" r="30" fill="#fed7aa"/>
              <path d="M-30,-25 Q0,-65 30,-25 Z" fill="#ffffff"/>
              <rect x="-25" y="20" width="50" height="40" fill="#ffffff" rx="4"/>
  </g>
  <text x="320" y="270" font-family="system-ui, sans-serif" font-size="52" font-weight="900" fill="#fbbf24" text-anchor="middle">+</text>
  <!-- Element 2: אֵין מֵעִיד (X) -->
  <g transform="translate(450, 250)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="60" fill="#7f1d1d" stroke="#ef4444" stroke-width="3"/>
              <line x1="-35" y1="-35" x2="35" y2="35" stroke="#f87171" stroke-width="10"/>
              <line x1="35" y1="-35" x2="-35" y2="35" stroke="#f87171" stroke-width="10"/>
  </g>
  <text x="580" y="270" font-family="system-ui, sans-serif" font-size="52" font-weight="900" fill="#fbbf24" text-anchor="middle">+</text>
  <!-- Element 3: עִיסָתוֹ (בָּצֵק) -->
  <g transform="translate(710, 250)" filter="url(#shadow)">
    <ellipse cx="0" cy="20" rx="60" ry="30" fill="#334155"/>
              <ellipse cx="0" cy="0" rx="45" ry="30" fill="#fef08a"/>
  </g>
</svg>