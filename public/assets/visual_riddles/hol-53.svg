<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" width="100%" height="100%" class="rebus-svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="900" height="550" rx="24" fill="url(#bgGrad)" stroke="#3f3f46" stroke-width="3"/>
  <rect x="15" y="15" width="870" height="520" rx="18" fill="none" stroke="#27272a" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- Content Graphics Area -->
  
    <g transform="translate(280, 260)" filter="url(#shadow)">
      
        <path d="M-40,60 Q0,0 40,-60" stroke="#15803d" stroke-width="6" fill="none" stroke-linecap="round"/>
        <ellipse cx="-15" cy="30" rx="10" ry="25" fill="#22c55e" transform="rotate(-35 -15 30)"/>
        <ellipse cx="15" cy="15" rx="10" ry="25" fill="#22c55e" transform="rotate(35 15 15)"/>
        <ellipse cx="-5" cy="-20" rx="10" ry="25" fill="#16a34a" transform="rotate(-35 -5 -20)"/>
        <ellipse cx="25" cy="-35" rx="10" ry="25" fill="#16a34a" transform="rotate(35 25 -35)"/>
      
    </g>
<text x="450" y="275" font-family="system-ui, sans-serif" font-size="64" font-weight="900" fill="#fbbf24" text-anchor="middle">+</text>

    <!-- Letter Block: הוֹשַׁע -->
    <g transform="translate(620, 260)" filter="url(#shadow)">
      <rect x="-65" y="-75" width="130" height="150" rx="20" fill="url(#cardGrad)" stroke="#fbbf24" stroke-width="4"/>
      <text x="0" y="38" font-family="Rubik, system-ui, sans-serif" font-size="70" font-weight="900" fill="url(#goldGrad)" text-anchor="middle">הוֹשַׁע</text>
    </g>
</svg>