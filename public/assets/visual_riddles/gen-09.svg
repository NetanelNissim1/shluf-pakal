<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" width="100%" height="100%" class="rebus-svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="900" height="550" rx="24" fill="url(#bgGrad)" stroke="#3f3f46" stroke-width="3"/>
  <rect x="15" y="15" width="870" height="520" rx="18" fill="none" stroke="#27272a" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- Content Graphics Area -->
  
  <!-- Element 1: עָלָה (חֵץ מַעְלָה) -->
  <g transform="translate(190, 250)" filter="url(#shadow)">
    <line x1="0" y1="50" x2="0" y2="-40" stroke="#f59e0b" stroke-width="12" stroke-linecap="round"/>
              <polygon points="-25,-35 25,-35 0,-65" fill="#f59e0b"/>
  </g>
  <text x="320" y="270" font-family="system-ui, sans-serif" font-size="52" font-weight="900" fill="#fbbf24" text-anchor="middle">+</text>
  <!-- Element 2: דָּם (טִפָּה) -->
  <g transform="translate(450, 250)" filter="url(#shadow)">
    <path d="M0,-60 Q35,0 0,55 Q-35,0 0,-60 Z" fill="url(#redGrad)"/>
  </g>
  <text x="580" y="270" font-family="system-ui, sans-serif" font-size="52" font-weight="900" fill="#fbbf24" text-anchor="middle">+</text>
  <!-- Element 3: לָרֹאשׁ -->
  <g transform="translate(710, 250)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="55" fill="#991b1b" stroke="#f87171" stroke-width="3"/>
              <circle cx="-18" cy="-10" r="6" fill="#ffffff"/>
              <circle cx="18" cy="-10" r="6" fill="#ffffff"/>
              <line x1="-25" y1="25" x2="25" y2="25" stroke="#ffffff" stroke-width="5"/>
  </g>
</svg>