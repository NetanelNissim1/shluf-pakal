<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" width="100%" height="100%" class="rebus-svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="900" height="550" rx="24" fill="url(#bgGrad)" stroke="#3f3f46" stroke-width="3"/>
  <rect x="15" y="15" width="870" height="520" rx="18" fill="none" stroke="#27272a" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- Content Graphics Area -->
  
  <!-- Element 1: כַּרְטִיס (מַעֲטָפָה) -->
  <g transform="translate(260, 250)" filter="url(#shadow)">
    <rect x="-70" y="-45" width="140" height="90" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
              <polygon points="-70,-45 0,10 70,-45" fill="none" stroke="#38bdf8" stroke-width="3"/>
              <rect x="25" y="-35" width="35" height="40" fill="#f59e0b" rx="2"/>
    <text x="0" y="130" font-family="system-ui, sans-serif" font-size="25" font-weight="900" fill="#60a5fa" text-anchor="middle">כַּרְטִיס (מַעֲטָפָה)</text>
  </g>
  <text x="450" y="270" font-family="system-ui, sans-serif" font-size="52" font-weight="900" fill="#fbbf24" text-anchor="middle">+</text>
  <!-- Element 2: בְּרָכָה (כּוֹכָב זוֹהֵר) -->
  <g transform="translate(640, 250)" filter="url(#shadow)">
    <polygon points="0,-65 18,-18 65,-18 28,12 42,60 0,30 -42,60 -28,12 -65,-18 -18,-18" fill="url(#goldGrad)" stroke="#78350f" stroke-width="2"/>
              <circle cx="0" cy="0" r="18" fill="#fef08a"/>
    <text x="0" y="130" font-family="system-ui, sans-serif" font-size="25" font-weight="900" fill="#fbbf24" text-anchor="middle">בְּרָכָה (כּוֹכָב זוֹהֵר)</text>
  </g>
</svg>