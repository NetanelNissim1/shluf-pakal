<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" width="100%" height="100%" class="rebus-svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="900" height="550" rx="24" fill="url(#bgGrad)" stroke="#3f3f46" stroke-width="3"/>
  <rect x="15" y="15" width="870" height="520" rx="18" fill="none" stroke="#27272a" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- Content Graphics Area -->
  
    <g transform="translate(280, 260)" filter="url(#shadow)">
      
        <rect x="-45" y="-60" width="90" height="120" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="3"/>
        <rect x="-55" y="-70" width="110" height="16" rx="8" fill="#78350f"/>
        <rect x="-55" y="55" width="110" height="16" rx="8" fill="#78350f"/>
        <line x1="-30" y1="-30" x2="30" y2="-30" stroke="#d97706" stroke-width="4"/>
        <line x1="-30" y1="-10" x2="30" y2="-10" stroke="#d97706" stroke-width="4"/>
        <line x1="-30" y1="10" x2="30" y2="10" stroke="#d97706" stroke-width="4"/>
        <line x1="-30" y1="30" x2="10" y2="30" stroke="#d97706" stroke-width="4"/>
      
    </g>
<text x="450" y="275" font-family="system-ui, sans-serif" font-size="64" font-weight="900" fill="#fbbf24" text-anchor="middle">+</text>

    <g transform="translate(620, 260)" filter="url(#shadow)">
      
        <rect x="-55" y="-35" width="110" height="70" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
        <line x1="-55" y1="-20" x2="55" y2="-20" stroke="#2563eb" stroke-width="6"/>
        <line x1="-55" y1="20" x2="55" y2="20" stroke="#2563eb" stroke-width="6"/>
        <polygon points="0,-12 12,9 -12,9" fill="none" stroke="#2563eb" stroke-width="3"/>
        <polygon points="0,12 12,-9 -12,-9" fill="none" stroke="#2563eb" stroke-width="3"/>
      
    </g>
</svg>