<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" width="100%" height="100%" class="rebus-svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="900" height="550" rx="24" fill="url(#bgGrad)" stroke="#3f3f46" stroke-width="3"/>
  <rect x="15" y="15" width="870" height="520" rx="18" fill="none" stroke="#27272a" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- Content Graphics Area -->
  
    <g transform="translate(680, 260)" filter="url(#shadow)">
      
        <path d="M-60,50 Q-30,30 -10,0 Q20,-40 70,-30 Q60,-15 15,10 Q-25,35 -50,60 Z" fill="url(#goldGrad)" stroke="#78350f" stroke-width="3"/>
        <path d="M60,-35 C75,-40 85,-20 70,-10 Z" fill="#d97706"/>
        <circle cx="-55" cy="55" r="8" fill="#451a03"/>
      
    </g>

    <!-- Letter Block: שֶׁל -->
    <g transform="translate(450, 260)" filter="url(#shadow)">
      <rect x="-65" y="-75" width="130" height="150" rx="20" fill="url(#cardGrad)" stroke="#fbbf24" stroke-width="4"/>
      <text x="0" y="38" font-family="Rubik, system-ui, sans-serif" font-size="70" font-weight="900" fill="url(#goldGrad)" text-anchor="middle">שֶׁל</text>
    </g>

    <g transform="translate(220, 260)" filter="url(#shadow)">
      
        <ellipse cx="0" cy="15" rx="55" ry="40" fill="#e2e8f0"/>
        <circle cx="40" cy="-15" r="28" fill="#cbd5e1"/>
        <path d="M45,-25 Q65,-55 35,-60 Q15,-60 25,-40 Q30,-25 45,-25" fill="none" stroke="#b45309" stroke-width="8" stroke-linecap="round"/>
        <circle cx="48" cy="-18" r="4" fill="#0f172a"/>
        <path d="M-30,55 L-30,75 M-10,55 L-10,75 M20,55 L20,75 M35,55 L35,75" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
      
    </g>
</svg>