<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" width="100%" height="100%" class="rebus-svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="900" height="550" rx="24" fill="url(#bgGrad)" stroke="#3f3f46" stroke-width="3"/>
  <rect x="15" y="15" width="870" height="520" rx="18" fill="none" stroke="#27272a" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- Content Graphics Area -->
  
    <g transform="translate(220, 260)" filter="url(#shadow)">
      
        <path d="M-40,50 C-10,50 30,30 60,0 C30,-30 -10,-50 -40,-50 Z" fill="url(#blueGrad)"/>
        <circle cx="30" cy="-12" r="9" fill="#ffffff"/>
        <circle cx="32" cy="-12" r="5" fill="#0f172a"/>
        <path d="M-5,10 Q5,25 -5,40" stroke="#1e3a8a" stroke-width="4" fill="none" stroke-linecap="round"/>
      
    </g>

    <!-- Letter Block: לֹא -->
    <g transform="translate(450, 260)" filter="url(#shadow)">
      <rect x="-65" y="-75" width="130" height="150" rx="20" fill="url(#cardGrad)" stroke="#fbbf24" stroke-width="4"/>
      <text x="0" y="38" font-family="Rubik, system-ui, sans-serif" font-size="70" font-weight="900" fill="url(#goldGrad)" text-anchor="middle">לֹא</text>
    </g>

    <g transform="translate(680, 260)" filter="url(#shadow)">
      
        <path d="M40,0 L-30,-50 C-10,-20 -10,20 -30,50 Z" fill="url(#blueGrad)"/>
        <path d="M30,0 L-10,-30 M30,0 L-10,30" stroke="#93c5fd" stroke-width="3"/>
      
    </g>
</svg>