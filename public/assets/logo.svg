<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Circle Gradient -->
    <radialGradient id="badgeBg" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#1f242d" />
      <stop offset="70%" stop-color="#0e1117" />
      <stop offset="100%" stop-color="#05070a" />
    </radialGradient>

    <!-- Compass Gold Gradient -->
    <linearGradient id="compassGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="35%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>

    <!-- Compass Accent Shadow/Facet -->
    <linearGradient id="goldFacet" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <!-- Campfire Flame Gradient -->
    <linearGradient id="flameMain" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="30%" stop-color="#ea580c" />
      <stop offset="65%" stop-color="#f59e0b" />
      <stop offset="90%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>

    <!-- Inner Core Flame Gradient -->
    <linearGradient id="flameInner" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="40%" stop-color="#fbbf24" />
      <stop offset="85%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- Campfire Wood Logs Gradient -->
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a16207" />
      <stop offset="50%" stop-color="#713f12" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>

    <!-- Outer Glow Filter -->
    <filter id="flameGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="badgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Circular Outer Badge Background -->
  <circle cx="256" cy="256" r="240" fill="url(#badgeBg)" stroke="url(#compassGold)" stroke-width="8" filter="url(#badgeGlow)" />
  <circle cx="256" cy="256" r="226" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6 6" opacity="0.4" />

  <!-- Compass Outer Ring -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="url(#compassGold)" stroke-width="6" opacity="0.85" />
  <circle cx="256" cy="256" r="162" fill="none" stroke="#fef3c7" stroke-width="1.5" opacity="0.3" />

  <!-- Diagonal Compass Points (NE, NW, SE, SW) -->
  <g id="diagonal-points" opacity="0.75">
    <!-- NE Point -->
    <polygon points="256,256 270,242 375,137 242,270" fill="url(#compassGold)" />
    <polygon points="256,256 242,270 375,137 256,256" fill="url(#goldFacet)" />
    <!-- NW Point -->
    <polygon points="256,256 242,242 137,137 270,270" fill="url(#compassGold)" />
    <polygon points="256,256 270,270 137,137 256,256" fill="url(#goldFacet)" />
    <!-- SE Point -->
    <polygon points="256,256 270,270 375,375 242,242" fill="url(#compassGold)" />
    <polygon points="256,256 242,242 375,375 256,256" fill="url(#goldFacet)" />
    <!-- SW Point -->
    <polygon points="256,256 242,270 137,375 270,242" fill="url(#compassGold)" />
    <polygon points="256,256 270,242 137,375 256,256" fill="url(#goldFacet)" />
  </g>

  <!-- Primary Cardinal Compass Points (N, S, E, W) with 3D Bevel -->
  <g id="cardinal-points">
    <!-- North Point (Top) -->
    <polygon points="256,48 256,256 226,230" fill="url(#goldFacet)" />
    <polygon points="256,48 256,256 286,230" fill="url(#compassGold)" />

    <!-- South Point (Bottom) -->
    <polygon points="256,464 256,256 286,282" fill="url(#goldFacet)" />
    <polygon points="256,464 256,256 226,282" fill="url(#compassGold)" />

    <!-- East Point (Right) -->
    <polygon points="464,256 256,256 282,226" fill="url(#goldFacet)" />
    <polygon points="464,256 256,256 282,286" fill="url(#compassGold)" />

    <!-- West Point (Left) -->
    <polygon points="48,256 256,256 230,286" fill="url(#goldFacet)" />
    <polygon points="48,256 256,256 230,226" fill="url(#compassGold)" />
  </g>

  <!-- Campfire Crossed Wood Logs -->
  <g id="campfire-logs" filter="url(#badgeGlow)">
    <!-- Left to Right Log -->
    <rect x="175" y="360" width="162" height="26" rx="12" transform="rotate(-18 256 373)" fill="url(#woodGrad)" stroke="#451a03" stroke-width="2" />
    <circle cx="184" cy="397" r="10" fill="#78350f" stroke="#451a03" stroke-width="2" />
    <circle cx="184" cy="397" r="5" fill="#a16207" />

    <!-- Right to Left Log -->
    <rect x="175" y="360" width="162" height="26" rx="12" transform="rotate(18 256 373)" fill="url(#woodGrad)" stroke="#451a03" stroke-width="2" />
    <circle cx="328" cy="397" r="10" fill="#78350f" stroke="#451a03" stroke-width="2" />
    <circle cx="328" cy="397" r="5" fill="#a16207" />
  </g>

  <!-- Campfire Flame Structure -->
  <!-- Outer Energetic Flame -->
  <path d="M256,120 
           C270,165 295,190 325,230 
           C355,270 360,315 335,355 
           C315,385 275,395 256,395 
           C237,395 197,385 177,355 
           C152,315 157,270 187,230 
           C217,190 242,165 256,120 Z" 
        fill="url(#flameMain)" 
        filter="url(#flameGlow)" />

  <!-- Middle Dancing Flame Tongue -->
  <path d="M256,160 
           C268,195 288,220 310,255 
           C330,290 330,325 310,352 
           C295,372 268,380 256,380 
           C244,380 217,372 202,352 
           C182,325 182,290 202,255 
           C224,220 244,195 256,160 Z" 
        fill="url(#flameInner)" />

  <!-- Inner Pure White-Gold Core -->
  <path d="M256,220 
           C264,248 278,268 288,295 
           C298,322 292,345 280,360 
           C270,372 260,375 256,375 
           C252,375 242,372 232,360 
           C220,345 214,322 224,295 
           C234,268 248,248 256,220 Z" 
        fill="#ffffff" 
        opacity="0.95" />

  <!-- Embers and Sparks -->
  <circle cx="295" cy="145" r="4.5" fill="#fef08a" filter="url(#flameGlow)" />
  <circle cx="225" cy="130" r="3.5" fill="#fef08a" filter="url(#flameGlow)" />
  <circle cx="330" cy="180" r="3" fill="#f97316" />
  <circle cx="185" cy="185" r="3" fill="#f97316" />
</svg>
