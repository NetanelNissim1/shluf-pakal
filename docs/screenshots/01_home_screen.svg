<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 860" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffdf7"/>
      <stop offset="100%" stop-color="#fdfbf0"/>
    </linearGradient>
    <linearGradient id="odt-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="visual-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
    <linearGradient id="taboo-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="tf-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08"/>
    </filter>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Phone Body Outer Frame -->
  <rect x="5" y="5" width="410" height="850" rx="42" fill="#1e293b" stroke="#334155" stroke-width="4"/>
  <!-- Screen Area -->
  <rect x="15" y="15" width="390" height="830" rx="34" fill="url(#bg-grad)"/>

  <!-- Speaker & Camera Notch -->
  <rect x="160" y="24" width="100" height="6" rx="3" fill="#334155"/>
  <circle cx="270" cy="27" r="3.5" fill="#334155"/>

  <!-- Top App Header -->
  <g transform="translate(15, 45)">
    <rect x="0" y="0" width="390" height="52" fill="#ffffff" filter="url(#shadow)"/>
    <text x="365" y="32" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="20" fill="#d97706" text-anchor="end">שלוף פק"ל</text>
    <rect x="200" y="18" width="82" height="20" rx="10" fill="#dcfce7"/>
    <text x="241" y="32" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="10" fill="#166534" text-anchor="middle">100% אופליין</text>
    <text x="85" y="33" font-size="14">⛺</text>
    <text x="55" y="33" font-size="14">🔍</text>
    <text x="25" y="33" font-size="14">🔊</text>
  </g>

  <!-- Search Input Bar -->
  <g transform="translate(30, 112)">
    <rect x="0" y="0" width="360" height="42" rx="14" fill="#ffffff" stroke="#fcd34d" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="335" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#9ca3af" text-anchor="middle">🔎</text>
    <text x="315" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#9ca3af" text-anchor="end">חיפוש מהיר בכל 2,525 התכנים...</text>
  </g>

  <!-- Situation Chips Scroll -->
  <g transform="translate(30, 166)">
    <!-- Active Chip: All -->
    <rect x="290" y="0" width="70" height="30" rx="10" fill="#d97706"/>
    <text x="325" y="19" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="11" fill="#ffffff" text-anchor="middle">כל החידות</text>
    <!-- Bus -->
    <rect x="200" y="0" width="82" height="30" rx="10" fill="#ffffff" stroke="#fef3c7" stroke-width="1"/>
    <text x="241" y="19" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="11" fill="#57534e" text-anchor="middle">🚌 באוטובוס</text>
    <!-- Walking -->
    <rect x="110" y="0" width="82" height="30" rx="10" fill="#ffffff" stroke="#fef3c7" stroke-width="1"/>
    <text x="151" y="19" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="11" fill="#57534e" text-anchor="middle">🥾 בשביל</text>
    <!-- Campfire -->
    <rect x="20" y="0" width="82" height="30" rx="10" fill="#ffffff" stroke="#fef3c7" stroke-width="1"/>
    <text x="61" y="19" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="11" fill="#57534e" text-anchor="middle">🔥 במדורה</text>
  </g>

  <!-- Difficulty Selector Pills -->
  <g transform="translate(30, 208)">
    <rect x="0" y="0" width="360" height="34" rx="12" fill="#f5f5f4"/>
    <rect x="270" y="3" width="86" height="28" rx="9" fill="#ffffff" filter="url(#shadow)"/>
    <text x="313" y="21" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="11" fill="#1c1917" text-anchor="middle">הכל (1,813)</text>
    <text x="225" y="21" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="11" fill="#15803d" text-anchor="middle">🟢 קליל (753)</text>
    <text x="135" y="21" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="11" fill="#b45309" text-anchor="middle">🟡 בינוני (1,012)</text>
    <text x="45" y="21" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="11" fill="#b91c1c" text-anchor="middle">🔴 מאתגר</text>
  </g>

  <!-- Section Title: Interactive Games Grid -->
  <g transform="translate(30, 260)">
    <text x="360" y="16" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="15" fill="#292524" text-anchor="end">משחקי שטח ואימוני מעגל</text>
    <text x="0" y="16" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="11" fill="#78716c" text-anchor="start">4 מנועי משחק</text>
  </g>

  <!-- Banner 1: ODT -->
  <g transform="translate(30, 288)" filter="url(#card-shadow)">
    <rect x="0" y="0" width="360" height="74" rx="18" fill="url(#odt-grad)"/>
    <rect x="296" y="14" width="46" height="46" rx="14" fill="#ffffff"/>
    <text x="319" y="44" font-size="22" text-anchor="middle">🧭</text>
    <text x="282" y="34" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="16" fill="#ffffff" text-anchor="end">אימוני שטח ו-ODT</text>
    <rect x="145" y="18" width="62" height="19" rx="9" fill="#ffffff" fill-opacity="0.22"/>
    <text x="176" y="32" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="10" fill="#ffffff" text-anchor="middle">101 מתודות</text>
    <text x="282" y="54" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="11" fill="#ccfbf1" text-anchor="end">מנהיגות, פיתוח צוות וטיימר שטח משולב</text>
    <text x="20" y="44" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="18" fill="#ffffff">‹</text>
  </g>

  <!-- Banner 2: Visual Riddles -->
  <g transform="translate(30, 372)" filter="url(#card-shadow)">
    <rect x="0" y="0" width="360" height="74" rx="18" fill="url(#visual-grad)"/>
    <rect x="296" y="14" width="46" height="46" rx="14" fill="#ffffff"/>
    <text x="319" y="44" font-size="22" text-anchor="middle">🎨</text>
    <text x="282" y="34" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="16" fill="#ffffff" text-anchor="end">חידות בציורים ורבוסים</text>
    <rect x="150" y="18" width="66" height="19" rx="9" fill="#ffffff" fill-opacity="0.22"/>
    <text x="183" y="32" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="10" fill="#ffffff" text-anchor="middle">154 איורים</text>
    <text x="282" y="54" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="11" fill="#ffe4e6" text-anchor="end">זום מלא, שידור מקרן וסריקת QR לחניכים</text>
    <text x="20" y="44" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="18" fill="#ffffff">‹</text>
  </g>

  <!-- Banner 3: Taboo Game -->
  <g transform="translate(30, 456)" filter="url(#card-shadow)">
    <rect x="0" y="0" width="360" height="74" rx="18" fill="url(#taboo-grad)"/>
    <rect x="296" y="14" width="46" height="46" rx="14" fill="#ffffff"/>
    <text x="319" y="44" font-size="22" text-anchor="middle">🏆</text>
    <text x="282" y="34" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="16" fill="#ffffff" text-anchor="end">משחק טאבו שטח</text>
    <rect x="145" y="18" width="68" height="19" rx="9" fill="#ffffff" fill-opacity="0.22"/>
    <text x="179" y="32" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="10" fill="#ffffff" text-anchor="middle">100 כרטיסים</text>
    <text x="282" y="54" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="11" fill="#fef3c7" text-anchor="end">טיימר 30/60/90 שנ', תחרות קבוצות וצפצוף</text>
    <text x="20" y="44" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="18" fill="#ffffff">‹</text>
  </g>

  <!-- Banner 4: True or False Game -->
  <g transform="translate(30, 540)" filter="url(#card-shadow)">
    <rect x="0" y="0" width="360" height="74" rx="18" fill="url(#tf-grad)"/>
    <rect x="296" y="14" width="46" height="46" rx="14" fill="#ffffff"/>
    <text x="319" y="44" font-size="22" text-anchor="middle">🎯</text>
    <text x="282" y="34" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="16" fill="#ffffff" text-anchor="end">משחק נכון / לא נכון</text>
    <rect x="155" y="18" width="60" height="19" rx="9" fill="#ffffff" fill-opacity="0.22"/>
    <text x="185" y="32" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="10" fill="#ffffff" text-anchor="middle">152 טענות</text>
    <text x="282" y="54" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="11" fill="#cffafe" text-anchor="end">טור בהליכה, מעגל פסילות והסברים מעשירים</text>
    <text x="20" y="44" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="18" fill="#ffffff">‹</text>
  </g>

  <!-- Category Grid Preview -->
  <g transform="translate(30, 626)">
    <text x="360" y="18" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="14" fill="#292524" text-anchor="end">קטגוריות תוכן שטח</text>
    
    <!-- Cat Card: He and She -->
    <rect x="185" y="28" width="175" height="54" rx="14" fill="#ffffff" stroke="#e7e5e4" filter="url(#shadow)"/>
    <text x="345" y="52" font-size="16">👫</text>
    <text x="320" y="50" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="12" fill="#292524" text-anchor="end">חידות הוא והיא</text>
    <text x="320" y="68" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="10" fill="#78716c" text-anchor="end">205 חידות שנונות</text>

    <!-- Cat Card: Holidays -->
    <rect x="0" y="28" width="175" height="54" rx="14" fill="#ffffff" stroke="#e7e5e4" filter="url(#shadow)"/>
    <text x="160" y="52" font-size="16">🍎</text>
    <text x="135" y="50" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="12" fill="#292524" text-anchor="end">חגי ישראל</text>
    <text x="135" y="68" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="10" fill="#78716c" text-anchor="end">318 מנהגים ומסורת</text>
  </g>

  <!-- Bottom Navigation Bar & FAB -->
  <g transform="translate(15, 775)">
    <rect x="0" y="0" width="390" height="70" fill="#ffffff" filter="url(#shadow)"/>
    <line x1="0" y1="0" x2="390" y2="0" stroke="#f5f5f4" stroke-width="1"/>

    <!-- Home Tab (Active) -->
    <text x="345" y="32" font-size="16" text-anchor="middle">🏠</text>
    <text x="345" y="48" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="10" fill="#d97706" text-anchor="middle">בית</text>

    <!-- Categories Tab -->
    <text x="270" y="32" font-size="16" text-anchor="middle">📂</text>
    <text x="270" y="48" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="10" fill="#78716c" text-anchor="middle">תוכן</text>

    <!-- Center Floating Action Button (FAB) -->
    <circle cx="195" cy="18" r="26" fill="#d97706" stroke="#ffffff" stroke-width="4" filter="url(#card-shadow)"/>
    <text x="195" y="26" font-size="22" text-anchor="middle" fill="#ffffff">🎲</text>

    <!-- Pakal Tab -->
    <text x="120" y="32" font-size="16" text-anchor="middle">⭐</text>
    <text x="120" y="48" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="10" fill="#78716c" text-anchor="middle">הפק"ל שלי</text>

    <!-- Feedback Tab -->
    <text x="45" y="32" font-size="16" text-anchor="middle">💡</text>
    <text x="45" y="48" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="10" fill="#78716c" text-anchor="middle">משוב</text>
  </g>
</svg>
