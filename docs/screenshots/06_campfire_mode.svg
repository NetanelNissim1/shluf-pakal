<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 860" width="100%" height="100%">
  <defs>
    <filter id="campfire-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#f97316" flood-opacity="0.35"/>
    </filter>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Phone Frame -->
  <rect x="5" y="5" width="410" height="850" rx="42" fill="#09090b" stroke="#27272a" stroke-width="4"/>
  <!-- Pure AMOLED Black Screen (#000000) -->
  <rect x="15" y="15" width="390" height="830" rx="34" fill="#000000"/>

  <!-- Speaker & Notch -->
  <rect x="160" y="24" width="100" height="6" rx="3" fill="#27272a"/>
  <circle cx="270" cy="27" r="3.5" fill="#27272a"/>

  <!-- Top App Header (Campfire Night Mode) -->
  <g transform="translate(15, 45)">
    <rect x="0" y="0" width="390" height="52" fill="#0c0a09" stroke="#292524" stroke-width="1"/>
    <text x="365" y="32" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="20" fill="#f97316" text-anchor="end">שלוף פק"ל</text>
    <rect x="180" y="18" width="95" height="20" rx="10" fill="#451a03" stroke="#9a3412"/>
    <text x="227" y="32" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="10" fill="#fdba74" text-anchor="middle">🔥 מצב מדורה פעיל</text>
    <text x="85" y="33" font-size="14">⛺</text>
    <text x="55" y="33" font-size="14">🔍</text>
    <text x="25" y="33" font-size="14">🔊</text>
  </g>

  <!-- Night Mode Explanation Badge -->
  <g transform="translate(30, 110)">
    <rect x="0" y="0" width="360" height="38" rx="12" fill="#1c1917" stroke="#7c2d12" stroke-width="1.2"/>
    <text x="345" y="24" font-size="14">🌙</text>
    <text x="325" y="24" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="11.5" fill="#fdba74" text-anchor="end">
      AMOLED #000000: שמירה על ראיית לילה ומניעת סנוור סביב המדורה
    </text>
  </g>

  <!-- Campfire Glowing Card 1: Taboo at Night -->
  <g transform="translate(30, 164)" filter="url(#campfire-glow)">
    <rect x="0" y="0" width="360" height="270" rx="22" fill="#0c0a09" stroke="#ea580c" stroke-width="1.8"/>

    <!-- Stealth Banner -->
    <rect x="0" y="0" width="360" height="30" rx="22" fill="#451a03"/>
    <rect x="0" y="16" width="360" height="14" fill="#451a03"/>
    <text x="180" y="20" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="11" fill="#fed7aa" text-anchor="middle">🔥 טאבו שטח במעגל הלילי (קבוצה א' משחקת)</text>

    <!-- Target Word -->
    <rect x="25" y="46" width="310" height="48" rx="12" fill="#1c1917" stroke="#9a3412" stroke-width="1.2"/>
    <text x="180" y="78" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="24" fill="#ffedd5" text-anchor="middle">עקרב צהוב</text>

    <!-- Forbidden Words with Night Tone -->
    <g transform="translate(35, 106)">
      <rect x="0" y="0" width="290" height="24" rx="7" fill="#292524"/>
      <text x="145" y="17" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="12" fill="#fca5a5" text-anchor="middle">ארסי</text>

      <rect x="0" y="28" width="290" height="24" rx="7" fill="#292524"/>
      <text x="145" y="45" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="12" fill="#fca5a5" text-anchor="middle">עוקץ</text>

      <rect x="0" y="56" width="290" height="24" rx="7" fill="#292524"/>
      <text x="145" y="73" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="12" fill="#fca5a5" text-anchor="middle">אולטרה סגול / פנס</text>

      <rect x="0" y="84" width="290" height="24" rx="7" fill="#292524"/>
      <text x="145" y="101" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="12" fill="#fca5a5" text-anchor="middle">מדבר / סלעים</text>
    </g>

    <!-- Round Running Timer -->
    <g transform="translate(25, 224)">
      <rect x="0" y="0" width="310" height="34" rx="10" fill="#1c1917" stroke="#7c2d12"/>
      <text x="290" y="22" font-size="14">⏱️</text>
      <text x="270" y="22" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="12" fill="#fdba74" text-anchor="end">נותרו 28 שניות לסיום הסיבוב!</text>
      <text x="25" y="23" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="14" fill="#22c55e">4 נק'</text>
    </g>
  </g>

  <!-- Campfire Riddle Card 2: Trivia Question in Night Mode -->
  <g transform="translate(30, 452)" filter="url(#campfire-glow)">
    <rect x="0" y="0" width="360" height="290" rx="22" fill="#0c0a09" stroke="#f97316" stroke-width="1.8"/>

    <!-- Card Top Header -->
    <g transform="translate(20, 24)">
      <rect x="220" y="0" width="100" height="22" rx="7" fill="#451a03"/>
      <text x="270" y="15" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="10.5" fill="#fdba74" text-anchor="middle">סביב המדורה 🔥</text>
      <text x="200" y="15" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="11" fill="#78716c" text-anchor="end">#12</text>
    </g>

    <!-- Riddle Question -->
    <g transform="translate(20, 60)">
      <text x="320" y="20" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="16" fill="#ffedd5" text-anchor="end">
        איזה כוכב בשמי הלילה מצביע תמיד
      </text>
      <text x="320" y="44" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="16" fill="#ffedd5" text-anchor="end">
        בדיוק אל כיוון הצפון?
      </text>
    </g>

    <!-- Solution Box in Campfire Theme -->
    <g transform="translate(20, 130)">
      <rect x="0" y="0" width="320" height="84" rx="14" fill="#1c1917" stroke="#ea580c" stroke-width="1.5"/>
      <text x="300" y="26" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="14" fill="#fb923c" text-anchor="end">
        הפתרון: כוכב הצפון (פולאריס) ⭐
      </text>
      <text x="300" y="50" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="11.5" fill="#fed7aa" text-anchor="end">
        כוכב הצפון ממוקם כמעט בדיוק מעל ציר הסיבוב של כדור
      </text>
      <text x="300" y="70" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="11.5" fill="#fed7aa" text-anchor="end">
        הארץ ולכן אינו זז במהלך הלילה.
      </text>
    </g>

    <!-- Night Actions -->
    <g transform="translate(20, 230)">
      <rect x="0" y="0" width="320" height="40" rx="12" fill="#292524" stroke="#44403c"/>
      <text x="160" y="25" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="12" fill="#fdba74" text-anchor="middle">
        ‹ לשאלה הבאה סביב המדורה
      </text>
    </g>
  </g>

  <!-- Bottom Navigation Bar (Campfire AMOLED) -->
  <g transform="translate(15, 775)">
    <rect x="0" y="0" width="390" height="70" fill="#0c0a09" stroke="#292524" stroke-width="1"/>
    <text x="345" y="32" font-size="16" text-anchor="middle">🏠</text>
    <text x="345" y="48" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="10" fill="#ea580c" text-anchor="middle">בית</text>
    <text x="270" y="32" font-size="16" text-anchor="middle">📂</text>
    <text x="270" y="48" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="10" fill="#78716c" text-anchor="middle">תוכן</text>
    <circle cx="195" cy="18" r="26" fill="#ea580c" stroke="#000000" stroke-width="4" filter="url(#campfire-glow)"/>
    <text x="195" y="26" font-size="22" text-anchor="middle" fill="#ffffff">🎲</text>
    <text x="120" y="32" font-size="16" text-anchor="middle">⭐</text>
    <text x="120" y="48" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="10" fill="#78716c" text-anchor="middle">הפק"ל שלי</text>
    <text x="45" y="32" font-size="16" text-anchor="middle">💡</text>
    <text x="45" y="48" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="10" fill="#78716c" text-anchor="middle">משוב</text>
  </g>
</svg>
