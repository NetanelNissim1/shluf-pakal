<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 860" width="100%" height="100%">
  <defs>
    <linearGradient id="taboo2-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffdf7"/>
      <stop offset="100%" stop-color="#fef8ee"/>
    </linearGradient>
    <linearGradient id="curtain-btn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08"/>
    </filter>
    <filter id="curtain-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Phone Frame -->
  <rect x="5" y="5" width="410" height="850" rx="42" fill="#1e293b" stroke="#334155" stroke-width="4"/>
  <rect x="15" y="15" width="390" height="830" rx="34" fill="url(#taboo2-bg)"/>

  <!-- Speaker & Notch -->
  <rect x="160" y="24" width="100" height="6" rx="3" fill="#334155"/>
  <circle cx="270" cy="27" r="3.5" fill="#334155"/>

  <!-- Top App Navigation Bar with UX 2.0 Badge -->
  <g transform="translate(15, 45)">
    <rect x="0" y="0" width="390" height="52" fill="#ffffff" filter="url(#shadow)"/>
    <text x="365" y="32" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="19" fill="#d97706" text-anchor="end">שלוף פק"ל</text>
    
    <!-- UX 2.0 Active Badge in Header -->
    <rect x="195" y="14" width="62" height="24" rx="12" fill="#d97706"/>
    <text x="226" y="30" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="11" fill="#ffffff" text-anchor="middle">2.0 ✨</text>
    
    <text x="75" y="33" font-size="14">⛺</text>
    <text x="45" y="33" font-size="14">🔊</text>
    <text x="15" y="33" font-size="14">💡</text>
  </g>

  <!-- Top Game Header Bar -->
  <g transform="translate(30, 110)">
    <text x="360" y="24" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="20" fill="#1c1917" text-anchor="end">🏆 טאבו שטח (UX 2.0)</text>
    <rect x="175" y="8" width="80" height="20" rx="10" fill="#fef3c7"/>
    <text x="215" y="22" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="10" fill="#92400e" text-anchor="middle">100 כרטיסים</text>
    
    <!-- Quick Mute Button (UX 2.0) -->
    <rect x="0" y="6" width="40" height="28" rx="8" fill="#f5f5f4" stroke="#d6d3d1"/>
    <text x="20" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="13" text-anchor="middle">🔇</text>
  </g>

  <!-- Micro-Hint Banner (UX 2.0) -->
  <g transform="translate(30, 150)">
    <rect x="0" y="0" width="360" height="32" rx="10" fill="#fffbeb" stroke="#fde68a"/>
    <text x="180" y="20" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="11" fill="#92400e" text-anchor="middle">💡 הסבר למעגל בלי לומר את המילים האסורות! (ימינה=הצלחה 👉)</text>
  </g>

  <!-- Animated Circular Timer -->
  <g transform="translate(210, 260)">
    <circle cx="0" cy="0" r="62" fill="none" stroke="#f5ebe0" stroke-width="10"/>
    <circle cx="0" cy="0" r="62" fill="none" stroke="#d97706" stroke-width="10" stroke-dasharray="390" stroke-dashoffset="0" stroke-linecap="round" transform="rotate(-90)"/>
    <text x="0" y="10" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" fill="#1c1917" text-anchor="middle">60</text>
    <text x="0" y="28" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="10" fill="#a8a29e" text-anchor="middle">שניות</text>
  </g>

  <!-- Live Score Pill -->
  <g transform="translate(30, 335)">
    <rect x="0" y="0" width="175" height="40" rx="12" fill="#ffffff" stroke="#e7e5e4" filter="url(#shadow)"/>
    <text x="155" y="25" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="11" fill="#059669" text-anchor="end">הצלחות בסיבוב:</text>
    <text x="25" y="27" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="16" fill="#059669">0</text>

    <rect x="185" y="0" width="175" height="40" rx="12" fill="#ffffff" stroke="#e7e5e4" filter="url(#shadow)"/>
    <text x="340" y="25" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="11" fill="#78716c" text-anchor="end">דילוגים / פסילה:</text>
    <text x="210" y="27" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="16" fill="#78716c">0</text>
  </g>

  <!-- Main Taboo Card with READY-SET-GO CURTAIN OVERLAY (UX 2.0) -->
  <g transform="translate(30, 390)">
    <!-- Underlying Card Shape -->
    <rect x="0" y="0" width="360" height="340" rx="24" fill="#ffffff" stroke="#fcd34d" stroke-width="2"/>
    
    <!-- DARK CURTAIN OVERLAY (Anti-Peeking by Design) -->
    <rect x="0" y="0" width="360" height="340" rx="24" fill="#0c0a09" opacity="0.96" filter="url(#curtain-shadow)"/>
    
    <!-- Rocket & Play Icon Container -->
    <circle cx="180" cy="90" r="34" fill="#d97706" opacity="0.2"/>
    <circle cx="180" cy="90" r="24" fill="#d97706"/>
    <polygon points="174,80 192,90 174,100" fill="#ffffff"/>

    <!-- Curtain Titles -->
    <text x="180" y="155" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="22" fill="#ffffff" text-anchor="middle">הסיבוב מוכן להזנקה!</text>
    <text x="180" y="180" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="12" fill="#a8a29e" text-anchor="middle">המילים מוסתרות כדי למנוע הצצות מוקדמות במעגל.</text>
    <text x="180" y="200" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="12" fill="#a8a29e" text-anchor="middle">לחצו על הכפתור כדי להפעיל את הטיימר ולחשוף!</text>

    <!-- Giant START ROUND Button (UX 2.0) -->
    <rect x="50" y="235" width="260" height="56" rx="20" fill="url(#curtain-btn)" filter="url(#shadow)"/>
    <text x="180" y="270" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="18" fill="#ffffff" text-anchor="middle">התחל סיבוב! 🚀</text>
  </g>

  <!-- Bottom Navigation Bar -->
  <g transform="translate(15, 755)">
    <rect x="0" y="0" width="390" height="75" rx="24" fill="#ffffff" filter="url(#shadow)"/>
    <text x="345" y="42" font-size="18">🏠</text>
    <text x="285" y="42" font-size="18">📚</text>
    <text x="225" y="42" font-size="18">🧭</text>
    <text x="165" y="42" font-size="18">🎨</text>
    <circle cx="105" cy="38" r="18" fill="#d97706"/>
    <text x="105" y="43" font-size="16" fill="#fff" text-anchor="middle">🏆</text>
    <text x="45" y="42" font-size="18">⭐</text>
  </g>
</svg>
