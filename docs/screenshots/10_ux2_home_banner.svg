<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 860" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffdf7"/>
      <stop offset="100%" stop-color="#fdfbf0"/>
    </linearGradient>
    <linearGradient id="taboo-grad2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="tf-grad2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="banner-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="50%" stop-color="#ffedd5"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Phone Frame -->
  <rect x="5" y="5" width="410" height="850" rx="42" fill="#1e293b" stroke="#334155" stroke-width="4"/>
  <rect x="15" y="15" width="390" height="830" rx="34" fill="url(#bg-grad2)"/>

  <!-- Speaker & Notch -->
  <rect x="160" y="24" width="100" height="6" rx="3" fill="#334155"/>
  <circle cx="270" cy="27" r="3.5" fill="#334155"/>

  <!-- Top App Header with UX 2.0 Badge -->
  <g transform="translate(15, 45)">
    <rect x="0" y="0" width="390" height="52" fill="#ffffff" filter="url(#shadow)"/>
    <text x="365" y="32" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="20" fill="#d97706" text-anchor="end">שלוף פק"ל</text>
    
    <rect x="195" y="14" width="62" height="24" rx="12" fill="#d97706"/>
    <text x="226" y="30" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="11" fill="#ffffff" text-anchor="middle">2.0 ✨</text>
    
    <text x="75" y="33" font-size="14">⛺</text>
    <text x="45" y="33" font-size="14">🔊</text>
    <text x="15" y="33" font-size="14">💡</text>
  </g>

  <!-- Search Bar -->
  <g transform="translate(30, 108)">
    <rect x="0" y="0" width="360" height="40" rx="14" fill="#ffffff" stroke="#fcd34d" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="335" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#9ca3af" text-anchor="middle">🔎</text>
    <text x="315" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#9ca3af" text-anchor="end">חיפוש מהיר בכל 2,525 התכנים...</text>
  </g>

  <!-- UX 2.0 HERO NOTIFICATION BANNER (ON HOME PAGE) -->
  <g transform="translate(30, 158)">
    <rect x="0" y="0" width="360" height="64" rx="16" fill="url(#banner-grad)" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>
    <circle cx="330" cy="32" r="16" fill="#f59e0b"/>
    <text x="330" y="38" font-size="16" text-anchor="middle">✨</text>
    
    <text x="300" y="26" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="13" fill="#1c1917" text-anchor="end">ממשק משחקים משודרג (UX 2.0) פעיל!</text>
    <rect x="85" y="14" width="46" height="18" rx="9" fill="#f59e0b"/>
    <text x="108" y="27" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="10" fill="#ffffff" text-anchor="middle">2.0 ✨</text>
    
    <text x="300" y="48" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="10" fill="#78716c" text-anchor="end">מסך זינוק בטאבו, סרגל התקדמות וכפתור ענק בנכון/לא נכון</text>

    <!-- Return to classic button -->
    <rect x="12" y="18" width="68" height="28" rx="8" fill="#ffffff" stroke="#fcd34d"/>
    <text x="46" y="36" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="10" fill="#78350f" text-anchor="middle">לקלאסי</text>
  </g>

  <!-- Situation Chips -->
  <g transform="translate(30, 234)">
    <rect x="270" y="0" width="90" height="32" rx="16" fill="#f59e0b"/>
    <text x="315" y="20" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="11" fill="#ffffff" text-anchor="middle">🚌 אוטובוס</text>

    <rect x="175" y="0" width="85" height="32" rx="16" fill="#ffffff" stroke="#e7e5e4"/>
    <text x="217" y="20" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="11" fill="#78716c" text-anchor="middle">🥾 הליכה</text>

    <rect x="85" y="0" width="80" height="32" rx="16" fill="#ffffff" stroke="#e7e5e4"/>
    <text x="125" y="20" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="11" fill="#78716c" text-anchor="middle">⛺ מדורה</text>
    
    <rect x="0" y="0" width="75" height="32" rx="16" fill="#ffffff" stroke="#e7e5e4"/>
    <text x="37" y="20" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="11" fill="#78716c" text-anchor="middle">❄️ קרח</text>
  </g>

  <!-- Taboo Game Card with UX 2.0 Badge -->
  <g transform="translate(30, 280)">
    <rect x="0" y="0" width="360" height="74" rx="18" fill="url(#taboo-grad2)" filter="url(#shadow)"/>
    <circle cx="320" cy="37" r="22" fill="#ffffff"/>
    <text x="320" y="44" font-size="20" text-anchor="middle">🏆</text>
    <text x="285" y="30" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="16" fill="#ffffff" text-anchor="end">משחק טאבו שטח</text>
    
    <!-- Sparkles 2.0 Badge -->
    <rect x="80" y="16" width="55" height="18" rx="9" fill="#ffffff"/>
    <text x="107" y="29" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="10" fill="#d97706" text-anchor="middle">✨ 2.0</text>
    
    <text x="285" y="52" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="11" fill="#fef3c7" text-anchor="end">מסך זינוק והסתרה, השתקה מהירה ותחרות קבוצות</text>
    <text x="25" y="42" font-size="18" fill="#ffffff">‹</text>
  </g>

  <!-- True/False Card with UX 2.0 Badge -->
  <g transform="translate(30, 366)">
    <rect x="0" y="0" width="360" height="74" rx="18" fill="url(#tf-grad2)" filter="url(#shadow)"/>
    <circle cx="320" cy="37" r="22" fill="#ffffff"/>
    <text x="320" y="44" font-size="20" text-anchor="middle">🎯</text>
    <text x="285" y="30" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="16" fill="#ffffff" text-anchor="end">משחק נכון / לא נכון</text>
    
    <!-- Sparkles 2.0 Badge -->
    <rect x="80" y="16" width="55" height="18" rx="9" fill="#fef3c7"/>
    <text x="107" y="29" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="10" fill="#065f46" text-anchor="middle">✨ 2.0</text>
    
    <text x="285" y="52" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="11" fill="#ecfdf5" text-anchor="end">סרגל התקדמות, כפתור ענק לאגודל וטיפים לשטח</text>
    <text x="25" y="42" font-size="18" fill="#ffffff">‹</text>
  </g>

  <!-- Bottom Nav -->
  <g transform="translate(15, 755)">
    <rect x="0" y="0" width="390" height="75" rx="24" fill="#ffffff" filter="url(#shadow)"/>
    <circle cx="345" cy="38" r="18" fill="#d97706"/>
    <text x="345" y="44" font-size="16" fill="#fff" text-anchor="middle">🏠</text>
    <text x="285" y="42" font-size="18">📚</text>
    <text x="225" y="42" font-size="18">🧭</text>
    <text x="165" y="42" font-size="18">🎨</text>
    <text x="105" y="42" font-size="18">🏆</text>
    <text x="45" y="42" font-size="18">⭐</text>
  </g>
</svg>
