<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 860" width="100%" height="100%">
  <defs>
    <linearGradient id="tf2-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffdf7"/>
      <stop offset="100%" stop-color="#fdfbf0"/>
    </linearGradient>
    <linearGradient id="next-btn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Phone Frame -->
  <rect x="5" y="5" width="410" height="850" rx="42" fill="#1e293b" stroke="#334155" stroke-width="4"/>
  <rect x="15" y="15" width="390" height="830" rx="34" fill="url(#tf2-bg)"/>

  <!-- Speaker & Notch -->
  <rect x="160" y="24" width="100" height="6" rx="3" fill="#334155"/>
  <circle cx="270" cy="27" r="3.5" fill="#334155"/>

  <!-- Top Header with UX 2.0 Badge -->
  <g transform="translate(15, 45)">
    <rect x="0" y="0" width="390" height="52" fill="#ffffff" filter="url(#shadow)"/>
    <text x="365" y="32" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="19" fill="#059669" text-anchor="end">נכון / לא נכון</text>
    
    <rect x="195" y="14" width="62" height="24" rx="12" fill="#059669"/>
    <text x="226" y="30" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="11" fill="#ffffff" text-anchor="middle">2.0 ✨</text>
    
    <text x="75" y="33" font-size="14">⛺</text>
    <text x="45" y="33" font-size="14">🔊</text>
    <text x="15" y="33" font-size="14">💡</text>
  </g>

  <!-- Visual Progress Bar (UX 2.0) -->
  <g transform="translate(30, 110)">
    <div xmlns="http://www.w3.org/1999/xhtml" style="display:flex; justify-content:space-between; font-size:11px; font-weight:800; color:#78716c;">
      <span>שאלה 4 מתוך 21</span>
      <span>19%</span>
    </div>
    <rect x="0" y="0" width="360" height="8" rx="4" fill="#e7e5e4"/>
    <rect x="0" y="0" width="68" height="8" rx="4" fill="#059669"/>
    <text x="360" y="24" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="11" fill="#78716c" text-anchor="end">שאלה 4 מתוך 21</text>
    <text x="0" y="24" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="11" fill="#059669">19% הושלמו</text>
  </g>

  <!-- Field Play Style Tip (UX 2.0) -->
  <g transform="translate(30, 145)">
    <rect x="0" y="0" width="360" height="34" rx="10" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="180" y="22" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="11" fill="#065f46" text-anchor="middle">💡 טיפ שטח להליכה בטור: צעד ימינה = נכון, צעד שמאלה = לא נכון!</text>
  </g>

  <!-- Question Card -->
  <g transform="translate(30, 195)">
    <rect x="0" y="0" width="360" height="150" rx="20" fill="#ffffff" stroke="#e7e5e4" filter="url(#shadow)"/>
    <rect x="250" y="14" width="95" height="24" rx="12" fill="#ecfdf5"/>
    <text x="297" y="30" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="11" fill="#065f46" text-anchor="middle">צפון הארץ והגולן</text>

    <text x="335" y="70" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="16" fill="#1c1917" text-anchor="end">החרמון הוא ההר הגבוה ביותר</text>
    <text x="335" y="94" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="16" fill="#1c1917" text-anchor="end">במדינת ישראל.</text>
    <text x="335" y="125" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="12" fill="#78716c" text-anchor="end">האם הטענה נכונה או שגויה?</text>
  </g>

  <!-- Celebratory Green Answer Result (UX 2.0) -->
  <g transform="translate(30, 360)">
    <rect x="0" y="0" width="360" height="120" rx="18" fill="#f0fdf4" stroke="#22c55e" stroke-width="2" filter="url(#shadow)"/>
    <circle cx="325" cy="40" r="18" fill="#22c55e"/>
    <polyline points="317,40 323,46 333,34" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    
    <text x="295" y="36" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="16" fill="#15803d" text-anchor="end">צדקתם! תשובה מעולה! 🎯</text>
    <rect x="20" y="20" width="130" height="22" rx="11" fill="#15803d"/>
    <text x="85" y="35" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="10" fill="#ffffff" text-anchor="middle">הטענה אכן נכונה ✅</text>

    <text x="335" y="75" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="12" fill="#166534" text-anchor="end">הפסגה הישראלית בחרמון מתנשאת לגובה של 2,236</text>
    <text x="335" y="95" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="12" fill="#166534" text-anchor="end">מטרים, והיא הפסגה הגבוהה ביותר בארץ ישראל.</text>
  </g>

  <!-- BIG NEXT QUESTION THUMB BUTTON (UX 2.0) -->
  <g transform="translate(30, 495)">
    <rect x="0" y="0" width="360" height="56" rx="20" fill="url(#next-btn)" filter="url(#shadow)"/>
    <text x="180" y="35" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="17" fill="#ffffff" text-anchor="middle">לשאלה הבאה ⬅️</text>
  </g>

  <!-- Navigation Toolbar -->
  <g transform="translate(30, 565)">
    <rect x="0" y="0" width="80" height="38" rx="10" fill="#f5f5f4" stroke="#e7e5e4"/>
    <text x="40" y="24" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="12" fill="#78716c" text-anchor="middle">➡️ הקודם</text>
    
    <rect x="260" y="0" width="100" height="38" rx="10" fill="#ffffff" stroke="#e7e5e4"/>
    <text x="310" y="24" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="12" fill="#78716c" text-anchor="middle">🎲 ערבב שאלות</text>
  </g>

  <!-- Bottom Nav -->
  <g transform="translate(15, 755)">
    <rect x="0" y="0" width="390" height="75" rx="24" fill="#ffffff" filter="url(#shadow)"/>
    <text x="345" y="42" font-size="18">🏠</text>
    <text x="285" y="42" font-size="18">📚</text>
    <text x="225" y="42" font-size="18">🧭</text>
    <text x="165" y="42" font-size="18">🎨</text>
    <text x="105" y="42" font-size="18">🏆</text>
    <text x="45" y="42" font-size="18">⭐</text>
  </g>
</svg>
