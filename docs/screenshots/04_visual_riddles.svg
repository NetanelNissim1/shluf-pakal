<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 860" width="100%" height="100%">
  <defs>
    <linearGradient id="vis-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffdf7"/>
      <stop offset="100%" stop-color="#faf5ff"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08"/>
    </filter>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Phone Frame -->
  <rect x="5" y="5" width="410" height="850" rx="42" fill="#1e293b" stroke="#334155" stroke-width="4"/>
  <rect x="15" y="15" width="390" height="830" rx="34" fill="url(#vis-bg)"/>

  <!-- Speaker & Notch -->
  <rect x="160" y="24" width="100" height="6" rx="3" fill="#334155"/>
  <circle cx="270" cy="27" r="3.5" fill="#334155"/>

  <!-- Top Header Bar -->
  <g transform="translate(30, 48)">
    <text x="360" y="22" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="18" fill="#1c1917" text-anchor="end">🎨 חידות בציורים ורבוסים</text>
    <rect x="120" y="6" width="75" height="20" rx="10" fill="#f3e8ff"/>
    <text x="157" y="20" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="10" fill="#7e22ce" text-anchor="middle">154 איורים</text>
    <text x="360" y="40" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="11" fill="#78716c" text-anchor="end">זום מלא, שידור מקרן וסריקת QR למעגל</text>

    <rect x="0" y="8" width="60" height="30" rx="10" fill="#ffffff" stroke="#e7e5e4" filter="url(#shadow)"/>
    <text x="30" y="28" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="11" fill="#44403c" text-anchor="middle">🎲 שלוף</text>
    <rect x="66" y="8" width="45" height="30" rx="10" fill="#fffbeb" stroke="#fde68a"/>
    <text x="88" y="28" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="11" fill="#92400e" text-anchor="middle">❓ עזרה</text>
  </g>

  <!-- Category Pills (Main Categories) -->
  <g transform="translate(30, 108)">
    <!-- Active: Holidays (108) -->
    <rect x="235" y="0" width="125" height="32" rx="10" fill="#9333ea"/>
    <text x="297" y="20" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="11" fill="#ffffff" text-anchor="middle">חגי ישראל (108)</text>

    <!-- Proverbs (25) -->
    <rect x="115" y="0" width="115" height="32" rx="10" fill="#ffffff" stroke="#e7e5e4" filter="url(#shadow)"/>
    <text x="172" y="20" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="11" fill="#57534e" text-anchor="middle">פתגמים (25)</text>

    <!-- Places (21) -->
    <rect x="0" y="0" width="110" height="32" rx="10" fill="#ffffff" stroke="#e7e5e4" filter="url(#shadow)"/>
    <text x="55" y="20" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="11" fill="#57534e" text-anchor="middle">אתרים (21)</text>
  </g>

  <!-- Holiday Sub-Tabs -->
  <g transform="translate(30, 150)">
    <rect x="300" y="0" width="60" height="26" rx="8" fill="#f3e8ff" stroke="#c084fc"/>
    <text x="330" y="17" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="10.5" fill="#6b21a8" text-anchor="middle">הכל (108)</text>

    <rect x="230" y="0" width="65" height="26" rx="8" fill="#ffffff" stroke="#e7e5e4"/>
    <text x="262" y="17" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="10.5" fill="#78716c" text-anchor="middle">תשרי (12)</text>

    <rect x="160" y="0" width="65" height="26" rx="8" fill="#ffffff" stroke="#e7e5e4"/>
    <text x="192" y="17" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="10.5" fill="#78716c" text-anchor="middle">חנוכה (12)</text>

    <rect x="85" y="0" width="70" height="26" rx="8" fill="#9333ea"/>
    <text x="120" y="17" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="10.5" fill="#ffffff" text-anchor="middle">פורים (12)</text>

    <rect x="15" y="0" width="65" height="26" rx="8" fill="#ffffff" stroke="#e7e5e4"/>
    <text x="47" y="17" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="10.5" fill="#78716c" text-anchor="middle">פסח (12)</text>
  </g>

  <!-- Visual Riddle Card -->
  <g transform="translate(30, 192)" filter="url(#card-shadow)">
    <rect x="0" y="0" width="360" height="560" rx="24" fill="#ffffff" stroke="#e9d5ff" stroke-width="2"/>

    <!-- Card Header -->
    <g transform="translate(20, 24)">
      <rect x="230" y="0" width="90" height="24" rx="8" fill="#fdf4ff" stroke="#f0abfc"/>
      <text x="275" y="16" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="11" fill="#a21caf" text-anchor="middle">חגי ישראל • פורים</text>

      <rect x="160" y="0" width="62" height="24" rx="8" fill="#fef3c7"/>
      <text x="191" y="16" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="10.5" fill="#92400e" text-anchor="middle">🟡 בינוני</text>

      <text x="145" y="16" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="11" fill="#a8a29e" text-anchor="end">#42</text>

      <!-- Action buttons -->
      <text x="65" y="18" font-size="15">📲</text>
      <text x="35" y="18" font-size="15">📱</text>
      <text x="5" y="18" font-size="15">⭐</text>
    </g>

    <!-- SVG Graphic Canvas (The Illustration) -->
    <g transform="translate(20, 64)">
      <rect x="0" y="0" width="320" height="260" rx="16" fill="#f5f3ff" stroke="#ddd6fe"/>
      
      <!-- Rebus Illustrated Scene -->
      <g transform="translate(160, 120)">
        <!-- Megillah Scroll -->
        <rect x="-80" y="-40" width="50" height="70" rx="8" fill="#fed7aa" stroke="#ea580c" stroke-width="2"/>
        <line x1="-70" y1="-25" x2="-40" y2="-25" stroke="#9a3412" stroke-width="2"/>
        <line x1="-70" y1="-10" x2="-40" y2="-10" stroke="#9a3412" stroke-width="2"/>
        <line x1="-70" y1="5" x2="-45" y2="5" stroke="#9a3412" stroke-width="2"/>

        <!-- Plus sign -->
        <text x="-15" y="5" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" fill="#7c3aed" text-anchor="middle">+</text>

        <!-- Wine Goblet -->
        <path d="M 20,-30 L 60,-30 L 48,0 L 48,25 L 32,25 L 32,0 Z" fill="#e9d5ff" stroke="#7e22ce" stroke-width="2"/>
        <ellipse cx="40" cy="25" rx="16" ry="5" fill="#7e22ce"/>
        <path d="M 24,-20 Q 40,-15 56,-20" fill="none" stroke="#dc2626" stroke-width="2.5"/>

        <text x="0" y="90" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="15" fill="#4c1d95" text-anchor="middle">"עד דלא ידע"</text>
      </g>
    </g>

    <!-- Full-Screen Presenter Button -->
    <g transform="translate(20, 338)">
      <rect x="0" y="0" width="320" height="42" rx="12" fill="#1c1917" filter="url(#shadow)"/>
      <text x="280" y="26" font-size="16">🔍</text>
      <text x="255" y="26" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="13" fill="#ffffff" text-anchor="end">מצב מנחה במסך מלא (AMOLED)</text>
      <rect x="20" y="10" width="80" height="22" rx="6" fill="#334155"/>
      <text x="60" y="25" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="10.5" fill="#cbd5e1" text-anchor="middle">זום עד x6</text>
    </g>

    <!-- Hint & Reveal Section -->
    <g transform="translate(20, 394)">
      <rect x="165" y="0" width="155" height="44" rx="12" fill="#fffbeb" stroke="#fde68a"/>
      <text x="300" y="27" font-size="15">💡</text>
      <text x="280" y="27" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="12" fill="#92400e" text-anchor="end">רמז קל (3 שנ')</text>

      <rect x="0" y="0" width="155" height="44" rx="12" fill="#f3e8ff" stroke="#d8b4fe"/>
      <text x="135" y="27" font-size="15">👁️</text>
      <text x="115" y="27" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="12" fill="#6b21a8" text-anchor="end">חשיפת פתרון</text>
    </g>

    <!-- Answer Box Sample -->
    <g transform="translate(20, 452)">
      <rect x="0" y="0" width="320" height="92" rx="14" fill="#faf5ff" stroke="#c084fc" stroke-width="1.5"/>
      <text x="300" y="26" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="13" fill="#6b21a8" text-anchor="end">הפתרון: משתה היין ועד דלא ידע 🍷</text>
      <text x="300" y="48" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="11" fill="#4c1d95" text-anchor="end">מגילת אסתר + גביע יין = מצוות משתה ושמחה בפורים</text>
      <text x="300" y="68" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="11" fill="#4c1d95" text-anchor="end">בה חייב אדם להתבסם עד שלא ידע בין ארור לברוך.</text>
    </g>
  </g>

  <!-- Bottom Navigation Bar & FAB -->
  <g transform="translate(15, 775)">
    <rect x="0" y="0" width="390" height="70" fill="#ffffff" filter="url(#shadow)"/>
    <line x1="0" y1="0" x2="390" y2="0" stroke="#f5f5f4" stroke-width="1"/>
    <text x="345" y="32" font-size="16" text-anchor="middle">🏠</text>
    <text x="345" y="48" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="10" fill="#78716c" text-anchor="middle">בית</text>
    <text x="270" y="32" font-size="16" text-anchor="middle">📂</text>
    <text x="270" y="48" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="10" fill="#78716c" text-anchor="middle">תוכן</text>
    <circle cx="195" cy="18" r="26" fill="#d97706" stroke="#ffffff" stroke-width="4" filter="url(#card-shadow)"/>
    <text x="195" y="26" font-size="22" text-anchor="middle" fill="#ffffff">🎲</text>
    <text x="120" y="32" font-size="16" text-anchor="middle">⭐</text>
    <text x="120" y="48" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="10" fill="#78716c" text-anchor="middle">הפק"ל שלי</text>
    <text x="45" y="32" font-size="16" text-anchor="middle">💡</text>
    <text x="45" y="48" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="10" fill="#78716c" text-anchor="middle">משוב</text>
  </g>
</svg>
