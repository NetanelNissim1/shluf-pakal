<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 860" width="100%" height="100%">
  <defs>
    <linearGradient id="tf-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffdf7"/>
      <stop offset="100%" stop-color="#fdfbf0"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08"/>
    </filter>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Phone Frame -->
  <rect x="5" y="5" width="410" height="850" rx="42" fill="#1e293b" stroke="#334155" stroke-width="4"/>
  <rect x="15" y="15" width="390" height="830" rx="34" fill="url(#tf-bg)"/>

  <!-- Speaker & Notch -->
  <rect x="160" y="24" width="100" height="6" rx="3" fill="#334155"/>
  <circle cx="270" cy="27" r="3.5" fill="#334155"/>

  <!-- Top Header Bar -->
  <g transform="translate(30, 48)">
    <rect x="325" y="6" width="35" height="34" rx="10" fill="#ffffff" stroke="#e7e5e4" filter="url(#shadow)"/>
    <text x="342" y="28" font-size="16" text-anchor="middle">›</text>

    <text x="315" y="22" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="18" fill="#1c1917" text-anchor="end">🎯 נכון / לא נכון</text>
    <rect x="135" y="6" width="70" height="20" rx="10" fill="#dcfce7"/>
    <text x="170" y="20" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="10" fill="#166534" text-anchor="middle">152 טענות</text>
    <text x="315" y="40" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="11" fill="#78716c" text-anchor="end">טריוויית שטח להליכה בטור ומעגל פסילות</text>

    <!-- Timer and Rules buttons -->
    <rect x="0" y="8" width="60" height="30" rx="10" fill="#ffffff" stroke="#e7e5e4" filter="url(#shadow)"/>
    <text x="30" y="28" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="11" fill="#44403c" text-anchor="middle">⏱️ 15ש'</text>
    <rect x="66" y="8" width="55" height="30" rx="10" fill="#fffbeb" stroke="#fde68a"/>
    <text x="93" y="28" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="11" fill="#92400e" text-anchor="middle">❓ חוקים</text>
  </g>

  <!-- Region Sub-Filter Tabs -->
  <g transform="translate(30, 110)">
    <!-- Active Tab: North -->
    <rect x="250" y="0" width="110" height="32" rx="10" fill="#059669"/>
    <text x="305" y="20" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="11" fill="#ffffff" text-anchor="middle">צפון וגולן (21)</text>

    <!-- Center -->
    <rect x="145" y="0" width="100" height="32" rx="10" fill="#ffffff" stroke="#e7e5e4" filter="url(#shadow)"/>
    <text x="195" y="20" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="11" fill="#57534e" text-anchor="middle">מרכז וחוף (21)</text>

    <!-- Jerusalem -->
    <rect x="35" y="0" width="105" height="32" rx="10" fill="#ffffff" stroke="#e7e5e4" filter="url(#shadow)"/>
    <text x="87" y="20" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="11" fill="#57534e" text-anchor="middle">ירושלים (21)</text>
  </g>

  <!-- Main Question Card (Answered Correctly - Adaptive Celebratory Green) -->
  <g transform="translate(30, 158)" filter="url(#card-shadow)">
    <rect x="0" y="0" width="360" height="430" rx="24" fill="#ffffff" stroke="#fcd34d" stroke-width="2"/>

    <!-- Card Top Header -->
    <g transform="translate(20, 24)">
      <rect x="240" y="0" width="80" height="22" rx="8" fill="#fef3c7"/>
      <text x="280" y="15" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="10.5" fill="#92400e" text-anchor="middle">שאלה 1 מתוך 21</text>

      <text x="230" y="15" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="11" fill="#a8a29e" text-anchor="end">צפון הארץ (גולן, גליל והכרמל)</text>
    </g>

    <!-- Question Statement Text -->
    <g transform="translate(25, 75)">
      <text x="155" y="30" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="22" fill="#1c1917" text-anchor="middle">
        "החרמון הוא ההר הגבוה
      </text>
      <text x="155" y="60" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="22" fill="#1c1917" text-anchor="middle">
        ביותר במדינת ישראל"
      </text>
    </g>

    <!-- Celebratory Adaptive Feedback Card (Green for Success) -->
    <g transform="translate(20, 170)">
      <rect x="0" y="0" width="320" height="150" rx="16" fill="#f0fdf4" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
      
      <!-- Checkmark Icon -->
      <circle cx="288" cy="32" r="16" fill="#10b981"/>
      <text x="288" y="38" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="18" fill="#ffffff" text-anchor="middle">✓</text>

      <!-- Headline -->
      <text x="260" y="30" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="15" fill="#047857" text-anchor="end">צדקתם! תשובה מעולה! 🎯</text>

      <!-- Status Badge -->
      <rect x="20" y="18" width="105" height="22" rx="7" fill="#059669"/>
      <text x="72" y="33" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="10.5" fill="#ffffff" text-anchor="middle">הטענה אכן נכונה ✅</text>

      <!-- Detailed Explanation Text -->
      <g transform="translate(20, 60)">
        <text x="280" y="18" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="12" fill="#064e3b" text-anchor="end">פסגת החרמון הישראלית מתנשאת לגובה של</text>
        <text x="280" y="38" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="12" fill="#064e3b" text-anchor="end">2,236 מטרים מעל פני הים, והיא הנקודה</text>
        <text x="280" y="58" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="12" fill="#064e3b" text-anchor="end">הגבוהה ביותר במדינת ישראל.</text>
      </g>
    </g>

    <!-- Bottom Controls Inside Card -->
    <g transform="translate(20, 355)">
      <line x1="0" y1="0" x2="320" y2="0" stroke="#f5f5f4" stroke-width="1.5"/>

      <!-- Prev button -->
      <rect x="235" y="18" width="85" height="40" rx="12" fill="#f5f5f4"/>
      <text x="277" y="43" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="12" fill="#78716c" text-anchor="middle">הקודם ›</text>

      <!-- Shuffle -->
      <rect x="145" y="18" width="80" height="40" rx="12" fill="#ffffff" stroke="#e7e5e4" filter="url(#shadow)"/>
      <text x="185" y="43" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="12" fill="#44403c" text-anchor="middle">🎲 ערבב</text>

      <!-- Next button -->
      <rect x="0" y="18" width="135" height="40" rx="12" fill="#059669" filter="url(#shadow)"/>
      <text x="67" y="43" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="13" fill="#ffffff" text-anchor="middle">‹ לשאלה הבאה</text>
    </g>
  </g>

  <!-- Bottom Navigation Bar & FAB -->
  <g transform="translate(15, 775)">
    <rect x="0" y="0" width="390" height="70" fill="#ffffff" filter="url(#shadow)"/>
    <line x1="0" y1="0" x2="390" y2="0" stroke="#f5f5f4" stroke-width="1"/>
    <text x="345" y="32" font-size="16" text-anchor="middle">🏠</text>
    <text x="345" y="48" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="10" fill="#78716c" text-anchor="middle">בית</text>
    <text x="270" y="32" font-size="16" text-anchor="middle">📂</text>
    <text x="270" y="48" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="10" fill="#78716c" text-anchor="middle">תוכן</text>
    <circle cx="195" cy="18" r="26" fill="#d97706" stroke="#ffffff" stroke-width="4" filter="url(#card-shadow)"/>
    <text x="195" y="26" font-size="22" text-anchor="middle" fill="#ffffff">🎲</text>
    <text x="120" y="32" font-size="16" text-anchor="middle">⭐</text>
    <text x="120" y="48" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="10" fill="#78716c" text-anchor="middle">הפק"ל שלי</text>
    <text x="45" y="32" font-size="16" text-anchor="middle">💡</text>
    <text x="45" y="48" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="10" fill="#78716c" text-anchor="middle">משוב</text>
  </g>
</svg>
