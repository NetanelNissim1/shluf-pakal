<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 860" width="100%" height="100%">
  <defs>
    <linearGradient id="taboo-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffdf7"/>
      <stop offset="100%" stop-color="#fef8ee"/>
    </linearGradient>
    <linearGradient id="success-btn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08"/>
    </filter>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Phone Frame -->
  <rect x="5" y="5" width="410" height="850" rx="42" fill="#1e293b" stroke="#334155" stroke-width="4"/>
  <rect x="15" y="15" width="390" height="830" rx="34" fill="url(#taboo-bg)"/>

  <!-- Speaker & Notch -->
  <rect x="160" y="24" width="100" height="6" rx="3" fill="#334155"/>
  <circle cx="270" cy="27" r="3.5" fill="#334155"/>

  <!-- Top Game Header Bar -->
  <g transform="translate(30, 48)">
    <text x="360" y="24" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="20" fill="#1c1917" text-anchor="end">🏆 טאבו שטח</text>
    <rect x="180" y="8" width="75" height="20" rx="10" fill="#fef3c7"/>
    <text x="217" y="22" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="10" fill="#92400e" text-anchor="middle">100 כרטיסים</text>
    <text x="360" y="44" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="11" fill="#78716c" text-anchor="end">הסבר את המושג בלי להגיד את המילים האסורות!</text>
    
    <rect x="0" y="10" width="82" height="30" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="1"/>
    <text x="41" y="30" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="11" fill="#78350f" text-anchor="middle">❓ חוקים</text>
  </g>

  <!-- Duration Selector & Team Switcher Bar -->
  <g transform="translate(30, 112)">
    <rect x="0" y="0" width="360" height="36" rx="12" fill="#f5f5f4" stroke="#e7e5e4"/>
    <text x="345" y="23" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="11" fill="#78716c" text-anchor="end">⏱️ זמן:</text>
    <rect x="250" y="4" width="40" height="28" rx="8" fill="#d97706"/>
    <text x="270" y="22" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="11" fill="#ffffff" text-anchor="middle">60ש'</text>
    <text x="220" y="22" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="11" fill="#78716c" text-anchor="middle">30ש'</text>
    <text x="175" y="22" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="11" fill="#78716c" text-anchor="middle">90ש'</text>
    
    <rect x="10" y="4" width="105" height="28" rx="8" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="62" y="22" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="11" fill="#065f46" text-anchor="middle">⚔️ תחרות קבוצות</text>
  </g>

  <!-- Cumulative Team Scoreboard -->
  <g transform="translate(30, 158)">
    <rect x="0" y="0" width="360" height="46" rx="14" fill="#ffffff" stroke="#fde68a" stroke-width="1.5" filter="url(#shadow)"/>
    <!-- Team A (Active) -->
    <rect x="195" y="6" width="155" height="34" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="335" y="28" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="12" fill="#78350f" text-anchor="end">קבוצה א'</text>
    <text x="265" y="29" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="15" fill="#78350f" text-anchor="middle">4 נק'</text>
    <rect x="202" y="13" width="46" height="20" rx="6" fill="#f59e0b"/>
    <text x="225" y="27" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="10" fill="#ffffff" text-anchor="middle">משחקת</text>

    <!-- VS Divider -->
    <text x="180" y="28" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="11" fill="#a8a29e" text-anchor="middle">VS</text>

    <!-- Team B -->
    <rect x="10" y="6" width="155" height="34" rx="10" fill="#fafaf9"/>
    <text x="150" y="28" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="12" fill="#78716c" text-anchor="end">קבוצה ב'</text>
    <text x="80" y="29" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="15" fill="#57534e" text-anchor="middle">3 נק'</text>
  </g>

  <!-- Circular Countdown Timer (Running at 42s) -->
  <g transform="translate(210, 268)">
    <circle cx="0" cy="0" r="48" fill="#ffffff" stroke="#f5f5f4" stroke-width="8" filter="url(#shadow)"/>
    <circle cx="0" cy="0" r="48" fill="none" stroke="#f59e0b" stroke-width="8" stroke-dasharray="301" stroke-dashoffset="90" stroke-linecap="round" transform="rotate(-90)"/>
    <text x="0" y="6" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="30" fill="#1c1917" text-anchor="middle">42</text>
    <text x="0" y="24" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="10" fill="#78716c" text-anchor="middle">שניות</text>
  </g>

  <!-- Live Round Score Tracker -->
  <g transform="translate(30, 332)">
    <!-- Correct in Round -->
    <rect x="185" y="0" width="175" height="42" rx="12" fill="#ffffff" stroke="#e7e5e4" filter="url(#shadow)"/>
    <text x="345" y="26" font-size="15">🎯</text>
    <text x="325" y="26" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="11" fill="#44403c" text-anchor="end">הצלחות בסיבוב:</text>
    <text x="210" y="28" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="18" fill="#16a34a" text-anchor="middle">4</text>

    <!-- Skipped in Round -->
    <rect x="0" y="0" width="175" height="42" rx="12" fill="#ffffff" stroke="#e7e5e4" filter="url(#shadow)"/>
    <text x="160" y="26" font-size="15">⏭️</text>
    <text x="140" y="26" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="11" fill="#44403c" text-anchor="end">דילוגים / פסילה:</text>
    <text x="25" y="28" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="18" fill="#a8a29e" text-anchor="middle">1</text>
  </g>

  <!-- The Main Taboo Card -->
  <g transform="translate(30, 386)" filter="url(#card-shadow)">
    <rect x="0" y="0" width="360" height="286" rx="20" fill="#ffffff" stroke="#fcd34d" stroke-width="2"/>
    
    <!-- Stealth Banner -->
    <rect x="0" y="0" width="360" height="30" rx="20" fill="#fef3c7"/>
    <rect x="0" y="16" width="360" height="14" fill="#fef3c7"/>
    <text x="180" y="20" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="10.5" fill="#92400e" text-anchor="middle">🔒 שמור את המסך מוסתר מהחניכים במעגל!</text>

    <!-- Card Meta -->
    <text x="340" y="52" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="11" fill="#a8a29e" text-anchor="end">כרטיס 1 מתוך 100</text>
    <text x="20" y="52" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="11" fill="#dc2626">🚫 מילים אסורות</text>

    <!-- Target Word Box -->
    <rect x="20" y="64" width="320" height="46" rx="12" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5"/>
    <text x="180" y="96" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="24" fill="#78350f" text-anchor="middle">פינג'אן</text>

    <!-- 5 Forbidden Words -->
    <g transform="translate(30, 122)">
      <rect x="0" y="0" width="300" height="26" rx="8" fill="#fef2f2" stroke="#fecaca"/>
      <text x="150" y="18" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="13" fill="#b91c1c" text-anchor="middle">קפה</text>

      <rect x="0" y="30" width="300" height="26" rx="8" fill="#fef2f2" stroke="#fecaca"/>
      <text x="150" y="48" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="13" fill="#b91c1c" text-anchor="middle">תה</text>

      <rect x="0" y="60" width="300" height="26" rx="8" fill="#fef2f2" stroke="#fecaca"/>
      <text x="150" y="78" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="13" fill="#b91c1c" text-anchor="middle">אש / גזייה</text>

      <rect x="0" y="90" width="300" height="26" rx="8" fill="#fef2f2" stroke="#fecaca"/>
      <text x="150" y="108" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="13" fill="#b91c1c" text-anchor="middle">פיקניק</text>

      <rect x="0" y="120" width="300" height="26" rx="8" fill="#fef2f2" stroke="#fecaca"/>
      <text x="150" y="138" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="13" fill="#b91c1c" text-anchor="middle">ערבי</text>
    </g>
  </g>

  <!-- Big Touch Targets: Skip & Success -->
  <g transform="translate(30, 684)">
    <!-- Skip Button -->
    <rect x="0" y="0" width="175" height="52" rx="16" fill="#f5f5f4" stroke="#d6d3d1" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="100" y="32" font-size="16">⏭️</text>
    <text x="80" y="32" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="14" fill="#44403c">דלג / פסילה</text>

    <!-- Success Button (+1) -->
    <rect x="185" y="0" width="175" height="52" rx="16" fill="url(#success-btn)" filter="url(#card-shadow)"/>
    <text x="300" y="32" font-size="18" fill="#ffffff">✓</text>
    <text x="275" y="32" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="15" fill="#ffffff">הצלחה! (+1)</text>
  </g>

  <!-- Bottom Navigation Bar & FAB -->
  <g transform="translate(15, 775)">
    <rect x="0" y="0" width="390" height="70" fill="#ffffff" filter="url(#shadow)"/>
    <line x1="0" y1="0" x2="390" y2="0" stroke="#f5f5f4" stroke-width="1"/>
    <text x="345" y="32" font-size="16" text-anchor="middle">🏠</text>
    <text x="345" y="48" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="10" fill="#78716c" text-anchor="middle">בית</text>
    <text x="270" y="32" font-size="16" text-anchor="middle">📂</text>
    <text x="270" y="48" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="10" fill="#78716c" text-anchor="middle">תוכן</text>
    <circle cx="195" cy="18" r="26" fill="#d97706" stroke="#ffffff" stroke-width="4" filter="url(#card-shadow)"/>
    <text x="195" y="26" font-size="22" text-anchor="middle" fill="#ffffff">🎲</text>
    <text x="120" y="32" font-size="16" text-anchor="middle">⭐</text>
    <text x="120" y="48" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="10" fill="#78716c" text-anchor="middle">הפק"ל שלי</text>
    <text x="45" y="32" font-size="16" text-anchor="middle">💡</text>
    <text x="45" y="48" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="10" fill="#78716c" text-anchor="middle">משוב</text>
  </g>
</svg>
