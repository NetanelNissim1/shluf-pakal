<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 860" width="100%" height="100%">
  <defs>
    <linearGradient id="drawer-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffdf7"/>
      <stop offset="100%" stop-color="#fdfbf0"/>
    </linearGradient>
    <linearGradient id="toggle-active" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08"/>
    </filter>
    <filter id="drawer-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="-8" stdDeviation="16" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Phone Frame -->
  <rect x="5" y="5" width="410" height="850" rx="42" fill="#1e293b" stroke="#334155" stroke-width="4"/>
  <rect x="15" y="15" width="390" height="830" rx="34" fill="url(#drawer-bg)"/>

  <!-- Speaker & Notch -->
  <rect x="160" y="24" width="100" height="6" rx="3" fill="#334155"/>
  <circle cx="270" cy="27" r="3.5" fill="#334155"/>

  <!-- Dimmed Background Overlay Behind Drawer -->
  <rect x="15" y="45" width="390" height="790" fill="#0c0a09" opacity="0.6"/>

  <!-- TOAST NOTIFICATION (UX 2.0 Toast) -->
  <g transform="translate(45, 65)">
    <rect x="0" y="0" width="330" height="42" rx="21" fill="#1c1917" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="165" y="26" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="13" fill="#fbbf24" text-anchor="middle">עברת לעיצוב משחקים 2.0 משודרג! ✨</text>
  </g>

  <!-- SETTINGS & FEEDBACK DRAWER (Slides up from bottom) -->
  <g transform="translate(15, 130)">
    <rect x="0" y="0" width="390" height="710" rx="32" fill="#ffffff" filter="url(#drawer-shadow)"/>
    
    <!-- Drawer Handle -->
    <rect x="165" y="12" width="60" height="5" rx="2.5" fill="#d6d3d1"/>

    <!-- Drawer Header -->
    <g transform="translate(20, 30)">
      <circle cx="330" cy="20" r="18" fill="#fef3c7"/>
      <text x="330" y="26" font-size="16" text-anchor="middle">💡</text>
      <text x="300" y="20" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="17" fill="#1c1917" text-anchor="end">הגדרות ושדרוג ממשק</text>
      <text x="300" y="38" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="11" fill="#78716c" text-anchor="end">התאמה אישית, משוב וסגנון משחקים</text>
      <text x="20" y="26" font-size="16" fill="#78716c">✕</text>
    </g>

    <!-- Line Divider -->
    <line x1="20" y1="85" x2="370" y2="85" stroke="#f5f5f4" stroke-width="1.5"/>

    <!-- UX MODE TOGGLE CARD (OPTION B IN DRAWER) -->
    <g transform="translate(20, 100)">
      <rect x="0" y="0" width="350" height="90" rx="20" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5" filter="url(#shadow)"/>
      
      <!-- Sparkles Badge -->
      <circle cx="315" cy="45" r="20" fill="#fef3c7"/>
      <text x="315" y="52" font-size="18" text-anchor="middle">✨</text>
      
      <text x="280" y="38" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="15" fill="#1c1917" text-anchor="end">ממשק משחקים משודרג (UX 2.0)</text>
      <text x="280" y="56" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="11" fill="#78716c" text-anchor="end">מסכי זינוק בטאבו, סרגלי התקדמות וכפתורי ענק</text>

      <!-- Toggle Button (Active 2.0) -->
      <rect x="15" y="28" width="100" height="34" rx="12" fill="url(#toggle-active)"/>
      <text x="65" y="50" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="12" fill="#ffffff" text-anchor="middle">פעיל (2.0) ✨</text>
    </g>

    <!-- Feedback Category Selector Mockup -->
    <g transform="translate(20, 210)">
      <text x="350" y="16" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="13" fill="#1c1917" text-anchor="end">נושא הפנייה או הרעיון:</text>
      <rect x="235" y="26" width="115" height="34" rx="10" fill="#fef3c7" stroke="#f59e0b"/>
      <text x="292" y="48" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="11" fill="#92400e" text-anchor="middle">💡 רעיון לחידה</text>
      
      <rect x="135" y="26" width="90" height="34" rx="10" fill="#f5f5f4" stroke="#e7e5e4"/>
      <text x="180" y="48" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="11" fill="#78716c" text-anchor="middle">✨ הצעת ייעול</text>
      
      <rect x="35" y="26" width="90" height="34" rx="10" fill="#f5f5f4" stroke="#e7e5e4"/>
      <text x="80" y="48" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="11" fill="#78716c" text-anchor="middle">🐛 דיווח תקלה</text>
    </g>

    <!-- Feedback Input Mockup -->
    <g transform="translate(20, 290)">
      <text x="350" y="16" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="13" fill="#1c1917" text-anchor="end">תוכן המשוב / הרעיון מהשטח:</text>
      <rect x="0" y="26" width="350" height="120" rx="14" fill="#fafaf9" stroke="#e7e5e4"/>
      <text x="330" y="55" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#a8a29e" text-anchor="end">שתפו אותנו ברעיון, הערה או חוויה מההדרכה בשטח...</text>
    </g>

    <!-- Send Feedback Button -->
    <g transform="translate(20, 450)">
      <rect x="0" y="0" width="350" height="50" rx="16" fill="#059669"/>
      <text x="175" y="32" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="16" fill="#ffffff" text-anchor="middle">שלח משוב לצוות הפיתוח ✉️</text>
    </g>
  </g>
</svg>
